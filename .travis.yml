language: go

# 1.6 and 1.7 dropped: `golang.org/dl/go1.6` / `go1.7` no longer resolve, so
# Travis silently falls back to its system Go (1.25.x) and the leg stops
# testing the version it claims to. 1.8 and 1.11.2 still provision, and 1.11.2
# is the release era's latest Go (replacing the unpinned `tip` entry).
go:
  - 1.8
  - 1.11.2

# Travis's default Go install step is `go get -v -t ./...`, which cannot run
# here: this is a pre-modules package with no go.mod and Travis no longer
# places the checkout inside GOPATH, so the fetch aborts before the suite
# starts. goutils imports only the standard library, so there is nothing to
# fetch — compile the package instead.
install: go build ./...

script:
  - go test -v
